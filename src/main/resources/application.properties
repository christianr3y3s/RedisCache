spring.application.name=event-store
nfe.cache.redis.enabled=true
nfe.cache.redis.key-prefix=nfe
nfe.cache.redis.namespace=producao
nfe.cache.redis.verbose-logging=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092
event.store.topic=event-store
nfe.cache.enabled=true
nfe.cache.key-prefix=nfe
nfe.cache.ttl=24h
nfe.kafka.topic=nfe-recebidas
spring.datasource.url=jdbc:h2:mem:eventstore
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true